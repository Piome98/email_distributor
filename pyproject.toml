[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-distributor"
version = "0.1.0"
description = "Automatically files Outlook mail by the sender's company, group and identity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pywin32>=306"]

[project.scripts]
email-distributor = "email_distributor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
